   *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:#ffcc00;
    position:sticky;
    top:0;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.logo img{
    border-radius:10px;
}

nav ul{
    display:flex;
    gap:30px;
    list-style:none;
}
nav a{
    text-decoration:none;
    color:#222;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:red;
}
#total{
    width:90%;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
    text-align:center;
    color:#e50914;
    font-size:28px;
}

/* CONTAINER */

#container{

    width:90%;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

    gap:30px;

    padding-bottom:40px;
}

/* CARD */

.movie{

    background:white;

    border-radius:15px;

    padding:18px;

    text-align:center;

    box-shadow:0 10px 20px rgba(0,0,0,.15);

    transition:.3s;
}

.movie:hover{

    transform:translateY(-8px);

    box-shadow:0 15px 30px rgba(0,0,0,.25);
}

.movie img{

    width:100%;

    height:340px;

    object-fit:cover;

    border-radius:12px;
}

.movie h2{

    margin:15px 0;

    font-size:28px;
}

.movie p{

    color:#555;

    margin:8px 0;

    font-size:17px;
}
  </style>

<script>
 let data = JSON.parse(localStorage.getItem("cart")) || [];
  console.log(data);

 function createCard(movie){

    let card=document.createElement("div");
    card.className="movie";

    card.innerHTML=`

        <img src="${movie.image}">

        <h2>${movie.movieName}</h2>

        <p>${movie.ageLimit}</p>

        <p>${movie.language}</p>

        <p><strong>₹${movie.price}</strong></p>

    `;

    container.append(card);

}

let total = data.reduce((prev, curr)=>{
  return prev = prev + curr.price;
}, 0)
console.log(total)
let price = document.getElementById("total");
price.innerText = `Total of your cart : ${total}`;
if(data.length===0){

    container.innerHTML="<h2>Your cart is empty.</h2>";

}

for(let i=0; i<data.length; i++){
  createCard(data[i]);
}
</script>
